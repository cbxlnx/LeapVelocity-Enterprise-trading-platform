openapi: 3.0.0
paths:
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponseDto'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
      security:
        - bearer: []
      tags:
        - auth
  /auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
      tags:
        - auth
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
      tags:
        - auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: Requires an unexpired refreshToken in the request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
      tags:
        - auth
  /health:
    get:
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Health
info:
  title: Authentication Service API
  description: >-
    Centralized authentication. Trading business endpoints belong to the
    separate Spring Boot API.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CurrentUserResponseDto:
      type: object
      properties:
        username:
          type: string
      required:
        - username
    AuthErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
      required:
        - statusCode
        - message
        - error
    RegisterDto:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
        password:
          type: string
          minLength: 8
          description: Maximum 72 UTF-8 bytes (bcrypt limit).
          format: password
          writeOnly: true
      required:
        - username
        - password
    RegisterResponseDto:
      type: object
      properties:
        username:
          type: string
        registered:
          type: boolean
          example: true
      required:
        - username
        - registered
    LoginDto:
      type: object
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          description: Maximum 72 UTF-8 bytes (bcrypt limit).
          format: password
          writeOnly: true
      required:
        - username
        - password
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Unexpired refresh JWT returned by login.
      required:
        - refreshToken
    AccessTokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
