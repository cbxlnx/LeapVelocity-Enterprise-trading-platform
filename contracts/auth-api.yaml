openapi: 3.0.3
info:
  title: Authentication Service API
  description: >
    API for managing user authentication and JWT token operations.
    All error responses follow the platform ErrorResponse envelope.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /api/v1/auth

paths:
  /login:
    post:
      summary: Authenticate user and issue JWT token
      tags:
        - auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Authentication successful, JWT token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '400':
          description: Invalid request (missing username or password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /register:
    post:
      summary: Register a new user
      tags:
        - auth
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDto'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseDto'
        '400':
          description: Invalid request (missing or invalid fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh:
    post:
      summary: Refresh JWT token using a valid or expired token
      tags:
        - auth
      operationId: refresh
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestDto'
      responses:
        '200':
          description: Token successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '400':
          description: Invalid request (missing token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or malformed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Service health check
      tags:
        - health
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequestDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: User's username
          example: john
        password:
          type: string
          description: User's password (plaintext in request)
          example: password

    RegisterRequestDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Desired username (must be unique)
          example: newuser
        password:
          type: string
          description: User's password (plaintext in request)
          example: securepassword

    RefreshRequestDto:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Current JWT token (valid or expired)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    TokenResponseDto:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: string
          description: Token expiration time
          example: 1h

    RegisterResponseDto:
      type: object
      required: [userId, username, message]
      properties:
        userId:
          type: string
          description: Unique ID of newly created user
          example: user123
        username:
          type: string
          description: Username of registered user
          example: newuser
        message:
          type: string
          description: Registration success message
          example: User registered successfully

    HealthResponseDto:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Service status
          example: up

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Error code (e.g., AUTH-401, AUTH-409, VAL-400)
          example: AUTH-401
        message:
          type: string
          description: Human-readable error message
          example: Invalid username or password
        timestamp:
          type: string
          format: date-time
          description: Timestamp when error occurred
          example: 2026-10-06T14:30:00Z
        path:
          type: string
          description: API path that generated the error
          example: /api/v1/auth/login
        details:
          type: object
          description: Additional error details for debugging
          example: { "field": "username", "reason": "not found" }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for /refresh endpoint