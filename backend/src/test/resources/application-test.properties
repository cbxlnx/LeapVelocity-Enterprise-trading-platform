# Spring Boot Test Profile Configuration

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration for testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Kafka auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# JWT configuration for testing
app.security.jwt.secret=test-secret-key-32-bytes-minimum
app.security.jwt.issuer=test-issuer
app.security.jwt.expiration-minutes=60

# Server configuration for tests
server.port=0

# Disable graceful shutdown for tests
server.shutdown=immediate