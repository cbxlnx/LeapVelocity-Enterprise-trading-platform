openapi: 3.0.3
info:
  title: Trading Platform API
  description: >
    API for managing and retrieving the status of trading orders.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /api/v1

paths:
  /orders:
    post:
      summary: Place a new trading order
      tags:
        - orders
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequestDto'
      responses:
        '201':
          description: Order successfully placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized - missing or invalid JWT
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    delete:
      summary: Cancel a trading order
      tags:
        - orders
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful response indicating the order has been canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Order not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}:
    get:
      summary: Retrieve account details
      tags:
        - accounts
      operationId: getAccount
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful response with account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/balance:
    get:
      summary: Retrieve account balance
      tags:
        - accounts
      operationId: getAccountBalance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/orders:
    get:
      summary: Retrieve all orders for an account
      tags:
        - accounts
      operationId: getAccountOrders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/positions:
    get:
      summary: Retrieve all positions (holdings) for an account
      tags:
        - accounts
      operationId: getAccountPositions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /market-data/quotes/{symbol}:
    get:
      summary: Retrieve the latest market quote for a symbol
      tags:
        - market-data
      operationId: getLatestQuote
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          example: AAPL
      responses:
        '200':
          description: Latest quote retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: No quote has been received yet for the symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /market-data/quotes:
    get:
      summary: Retrieve latest market quotes for several symbols
      description: >-
        Symbols are trimmed, upper-cased and de-duplicated. Unknown symbols are listed in
        missingSymbols and still return HTTP 200. Use lastPrice for valuation and asOf to judge freshness.
      tags:
        - market-data
      operationId: getLatestQuotes
      security:
        - bearerAuth: []
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ticker symbols, at most 50 entries; each 1-20 characters
          example: AAPL,MSFT
      responses:
        '200':
          description: Quotes retrieved; unknown symbols are listed in missingSymbols
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchQuotesDto'
        '400':
          description: symbols is missing, has a blank or over-length entry, or exceeds 50 entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid JWT
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /instruments/search:
    get:
      summary: Search instruments by symbol or name prefix
      tags:
        - instruments
      operationId: searchInstruments
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            default: ''
          description: Symbol or name prefix to match; blank returns an empty list
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Maximum number of results; values outside 1-50 are clamped
      responses:
        '200':
          description: Matching instruments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PlaceOrderRequestDto:
      type: object
      required: [accountId, symbol, quantity, price, side, idempotencyKey]
      properties:
        accountId:
          type: integer
          format: int64
          description: Account ID placing the order
        symbol:
          type: string
          description: Instrument ticker symbol
          example: USEQUITY
        quantity:
          type: number
          format: double
          description: Number of shares
        price:
          type: number
          format: double
          description: Price per share
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        idempotencyKey:
          type: string
          description: Unique key to prevent duplicate orders

    OrderDto:
      type: object
      required: [id, accountId, symbol, side, quantity, price, status, idempotencyKey, createdOn]
      properties:
        id:
          type: integer
          format: int64
          description: Unique order identifier
        accountId:
          type: integer
          format: int64
          description: Account that placed the order
        symbol:
          type: string
          description: Instrument ticker symbol
          example: USEQUITY
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        quantity:
          type: number
          format: double
          description: Number of shares
        price:
          type: number
          format: double
          description: Price per share
        status:
          type: string
          enum: [NEW, ACCEPTED, REJECTED, CANCELLED, FILLED]
          description: Current order status
        idempotencyKey:
          type: string
          description: Unique key to prevent duplicate orders
        createdOn:
          type: string
          format: date-time
          description: Order submission timestamp

    AccountDto:
      type: object
      required: [id, accountId, holderName, cashBalance, status]
      properties:
        id:
          type: integer
          format: int64
          description: Internal account identifier
        accountId:
          type: string
          description: Public-facing account identifier
        holderName:
          type: string
          description: Account holder's name
        cashBalance:
          type: number
          format: double
          description: Available cash balance
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          description: Account status
        version:
          type: integer
          format: int64
          description: Optimistic lock version
        lastUpdated:
          type: string
          format: date-time
          description: Last update timestamp

    PositionDto:
      type: object
      required: [id, accountId, symbol, quantity, averageCost]
      properties:
        id:
          type: integer
          format: int64
          description: Unique position identifier
        accountId:
          type: integer
          format: int64
          description: Account holding the position
        symbol:
          type: string
          description: Instrument ticker symbol
          example: USEQUITY
        quantity:
          type: number
          format: double
          description: Number of shares held
        averageCost:
          type: number
          format: double
          description: Average acquisition cost per share

    QuoteDto:
      type: object
      required: [symbol, lastPrice, asOf, source]
      properties:
        symbol:
          type: string
          description: Instrument ticker symbol
          example: AAPL
        lastPrice:
          type: number
          format: double
          description: Last traded price
        bid:
          type: number
          format: double
          description: Best bid price
        ask:
          type: number
          format: double
          description: Best ask price
        currency:
          type: string
          description: Quote currency
          example: USD
        asOf:
          type: string
          format: date-time
          description: Quote timestamp reported by the publisher
        source:
          type: string
          description: Data source name
          example: yfinance

    BatchQuotesDto:
      type: object
      required: [quotes, missingSymbols, serverTimestamp]
      properties:
        quotes:
          type: array
          description: Quotes for the requested symbols that have been received, in request order
          items:
            $ref: '#/components/schemas/QuoteDto'
        missingSymbols:
          type: array
          description: Normalized requested symbols with no quote received yet
          items:
            type: string
            example: MSFT
        serverTimestamp:
          type: string
          format: date-time
          description: Time the batch response was built

    InstrumentDto:
      type: object
      required: [id, symbol, name, assetClass, currency, tradable]
      properties:
        id:
          type: integer
          format: int64
          description: Internal instrument identifier
        symbol:
          type: string
          description: Instrument ticker symbol
          example: AAPL
        name:
          type: string
          description: Instrument display name
        assetClass:
          type: string
          description: Asset class
          example: EQUITY
        currency:
          type: string
          description: Trading currency
          example: USD
        tradable:
          type: boolean
          description: Whether orders can be placed for the instrument

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Error message details

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Unexpired NestJS-issued access JWT required; signature and issuer are verified by Spring Security
