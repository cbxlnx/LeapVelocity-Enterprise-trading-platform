openapi: 3.0.3
info:
  title: Trading Platform API
  description: >
    API for managing and retrieving the status of trading orders.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /api/v1

paths:
  /orders:
    post:
      summary: Place a new trading order
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequestDto'
      responses:
        '201':
          description: Order successfully placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized - missing or invalid JWT

  /orders/{id}:
    delete:
      summary: Cancel a trading order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful response indicating the order has been canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Order not found

  /accounts/{id}:
    get:
      summary: Retrieve account details
      operationId: getAccount
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful response with account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found

  /accounts/{id}/balance:
    get:
      summary: Retrieve account balance
      operationId: getAccountBalance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found

  /accounts/{id}/orders:
    get:
      summary: Retrieve all orders for an account
      operationId: getAccountOrders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found

  /accounts/{id}/positions:
    get:
      summary: Retrieve all positions (holdings) for an account
      operationId: getAccountPositions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionDto'
        '401':
          description: Unauthorized - missing or invalid JWT
        '404':
          description: Account not found
components:
  schemas:
    PlaceOrderRequestDto:
      type: object
      required: [accountId, symbol, quantity, price, side, idempotencyKey]
      properties:
        accountId:
          type: integer
          format: int64
          description: Account ID placing the order
        symbol:
          type: string
          description: Instrument ticker symbol
        quantity:
          type: number
          format: double
          description: Number of shares
        price:
          type: number
          format: double
          description: Price per share
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        idempotencyKey:
          type: string
          description: Unique key to prevent duplicate orders

    OrderDto:
      type: object
      required: [id, accountId, symbol, side, quantity, price, status, idempotencyKey, createdOn]
      properties:
        id:
          type: integer
          format: int64
          description: Unique order identifier
        accountId:
          type: integer
          format: int64
          description: Account that placed the order
        symbol:
          type: string
          description: Instrument ticker symbol
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        quantity:
          type: number
          format: double
          description: Number of shares
        price:
          type: number
          format: double
          description: Price per share
        status:
          type: string
          enum: [NEW, ACCEPTED, REJECTED, CANCELLED, FILLED]
          description: Current order status
        idempotencyKey:
          type: string
          description: Unique key to prevent duplicate orders
        createdOn:
          type: string
          format: date-time
          description: Order submission timestamp

    AccountDto:
      type: object
      required: [id, accountId, holderName, cashBalance, status]
      properties:
        id:
          type: integer
          format: int64
          description: Internal account identifier
        accountId:
          type: string
          description: Public-facing account identifier
        holderName:
          type: string
          description: Account holder's name
        cashBalance:
          type: number
          format: double
          description: Available cash balance
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          description: Account status
        version:
          type: integer
          format: int64
          description: Optimistic lock version
        lastUpdated:
          type: string
          format: date-time
          description: Last update timestamp

    PositionDto:
      type: object
      required: [id, accountId, symbol, quantity, averageCost]
      properties:
        id:
          type: integer
          format: int64
          description: Unique position identifier
        accountId:
          type: integer
          format: int64
          description: Account holding the position
        symbol:
          type: string
          description: Instrument ticker symbol
        quantity:
          type: number
          format: double
          description: Number of shares held
        averageCost:
          type: number
          format: double
          description: Average acquisition cost per share

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Error message details

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token required for authentication (to be implemented)
