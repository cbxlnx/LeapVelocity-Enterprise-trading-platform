spring.application.name=trading-platform
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/leapvelocity_trading_db?sslmode=disable
spring.datasource.username=postgres
# change the password as needed
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# JWT settings for the lab stub authentication flow.
# Override APP_SECURITY_JWT_SECRET outside local development.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-this-development-secret-key-32b}
app.security.jwt.issuer=leapvelocity-auth
app.security.jwt.expiration-minutes=30
