services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-platform-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://trade-db:5432/${DB_NAME:-leapvelocity_trading_db}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      trade-db:
        condition: service_healthy

  trade-db:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: trading-platform-db
    environment:
      POSTGRES_DB: ${DB_NAME:-leapvelocity_trading_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trade-db-data:
