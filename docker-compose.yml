services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      TRADE_API_UPSTREAM: ${TRADE_API_UPSTREAM:-trade-api:8081}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-auth-stub:4000}
    ports:
      - "${FRONTEND_PORT:-8085}:8080"
    depends_on:
      trade-api:
        condition: service_started
      auth-stub:
        condition: service_started
    networks:
      - trade-net

  # Runs a finite batch and exits; this is not a web service or a scheduler.
  analytics-import:
    image: leapvelocity-analysis:local
    build:
      context: ./analysis
      dockerfile: Dockerfile
    command: ["python", "scripts/import_data.py"]
    environment:
      DB_HOST: trade-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-leapvelocity_trading_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: "no"
    depends_on:
      trade-db:
        condition: service_healthy
    networks:
      - trade-net

  # Snapshot-only calculator; no host port, database credentials or importer process.
  risk-api:
    image: leapvelocity-analysis:local
    build:
      context: ./analysis
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "risk_service.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RISK_SERVICE_TOKEN: ${RISK_SERVICE_TOKEN:?RISK_SERVICE_TOKEN is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - trade-net

  auth-stub:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: trading-platform-auth-stub
    environment:
      PORT: 4000
      DB_HOST: trade-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-leapvelocity_trading_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-leapvelocity-auth}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
    ports:
      - "${AUTH_STUB_PORT:-4000}:4000"
    depends_on:
      trade-db:
        condition: service_healthy
    networks:
      - trade-net

  trade-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://trade-db:5432/${DB_NAME:-leapvelocity_trading_db}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_SECURITY_JWT_ISSUER: ${JWT_ISSUER:-leapvelocity-auth}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8085,http://127.0.0.1:4200,http://127.0.0.1:8085}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RISK_SERVICE_URL: http://risk-api:8000
      RISK_SERVICE_TOKEN: ${RISK_SERVICE_TOKEN:?RISK_SERVICE_TOKEN is required}
      RISK_SERVICE_CONNECT_TIMEOUT_MS: ${RISK_SERVICE_CONNECT_TIMEOUT_MS:-1000}
      RISK_SERVICE_READ_TIMEOUT_MS: ${RISK_SERVICE_READ_TIMEOUT_MS:-5000}
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      trade-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      risk-api:
        condition: service_healthy
    networks:
      - trade-net

  execution-engine:
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: trading-platform-execution-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trade-net

  market-data-publisher:
    build:
      context: ./market-data-publisher
      dockerfile: Dockerfile
    container_name: trading-platform-market-data-publisher
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-}
      MARKET_DATA_POLL_SECONDS: ${MARKET_DATA_POLL_SECONDS:-5}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trade-net

  trade-db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: trading-platform-db
    environment:
      POSTGRES_DB: ${DB_NAME:-leapvelocity_trading_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trade-net

  kafka:
    image: apache/kafka:latest
    container_name: trading-platform-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    networks:
      - trade-net

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: trading-platform-kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trade-net
      
volumes:
  trade-db-data:
 
networks:
  trade-net:
    driver: bridge
