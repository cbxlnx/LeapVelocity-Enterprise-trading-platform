services:
  auth-stub:
    build:
      context: ./auth-stub
      dockerfile: Dockerfile
    container_name: trading-platform-auth-stub
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-leapvelocity-shared-secret-key-32-bytes-minimum}
      JWT_ISSUER: ${JWT_ISSUER:-leapvelocity-auth}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "${AUTH_STUB_PORT:-4000}:4000"
    networks:
      - trade-net

  trade-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://trade-db:5432/${DB_NAME:-leapvelocity_trading_db}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:-leapvelocity-shared-secret-key-32-bytes-minimum}
      APP_SECURITY_JWT_ISSUER: ${JWT_ISSUER:-leapvelocity-auth}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      trade-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - trade-net

  execution-engine:
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: execution-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
    ports:
      - "${EXECUTION_ENGINE_PORT:-8082}:8082"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trade-net

  trade-db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: trading-platform-db
    environment:
      POSTGRES_DB: ${DB_NAME:-leapvelocity_trading_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trade-net

  kafka:
    image: apache/kafka:latest
    container_name: trading-platform-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    networks:
      - trade-net

volumes:
  trade-db-data:

networks:
  trade-net:
    driver: bridge
