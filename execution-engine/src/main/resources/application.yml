spring:
  application:
    name: execution-engine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: execution-engine
      auto-offset-reset: earliest
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    com.neueda.trading.engine: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

engine:
  quote-staleness: ${ENGINE_QUOTE_STALENESS:15s}
  venue: SIM
  topics:
    orders: orders
    executions: ${ENGINE_TOPICS_EXECUTIONS:trade-events}
    market-data: market-data
    dead-letter: ${ENGINE_TOPICS_DEAD_LETTER:orders-dlq}
    partitions: 3
  retry:
    max-retries: ${ENGINE_RETRY_MAX_RETRIES:60}
    initial-backoff: ${ENGINE_RETRY_INITIAL_BACKOFF:1s}
    backoff-multiplier: ${ENGINE_RETRY_BACKOFF_MULTIPLIER:2.0}
    max-backoff: ${ENGINE_RETRY_MAX_BACKOFF:5s}

