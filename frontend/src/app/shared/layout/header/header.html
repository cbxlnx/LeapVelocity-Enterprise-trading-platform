<header class="topbar">
    <div class="brand">
        <div class="logo">ET</div>
        <div class="brand-text">
            <div class="title">Enterprise Trading Platform</div>
            <div class="subtitle">INSTITUTIONAL EXECUTION</div>
        </div>
    </div>
    <nav class="nav-links" aria-label="Main navigation">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
        <a routerLink="/analytics" routerLinkActive="active">Analytics</a>
        <a routerLink="/order" routerLinkActive="active">Order Ticket</a>
        <a routerLink="/blotter" routerLinkActive="active">Blotter</a>
    </nav>

    <div class="user-area">
        <a
            routerLink="/settings"
            routerLinkActive="settings-active"
            class="settings-link"
            aria-label="Open account settings"
            title="Account settings">
            <span aria-hidden="true">⚙</span>
        </a>
        <div class="user-meta">
            <div class="name">{{ userName }}</div>
            <div class="acc">{{ accountId }}</div>
        </div>
        <button
            type="button"
            class="theme-toggle"
            (click)="toggleTheme()"
            [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
            [attr.aria-pressed]="themeService.theme() === 'dark'"
            [attr.title]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
            <span aria-hidden="true">{{ themeService.theme() === 'dark' ? '☀' : '☾' }}</span>
        </button>
        <button type="button" class="logout" (click)="logout()">Logout</button>
    </div>
</header>
